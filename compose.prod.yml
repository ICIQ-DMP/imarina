services:
  agent:
    build:
      context: .
      dockerfile: agent.Dockerfile
    container_name: imarina-load-researcher-agent
    expose:
      - ${AGENT_PORT_INTERNAL}
    volumes:
      - ./services/onedrive_data:/home/jenkins/agent/onedrive_data
      - type: bind
        source: ./services/jenkins_agent_keys
        target: /home/jenkins/.ssh
        read_only: false
    environment:
      - JENKINS_AGENT_SSH_PUBKEY=${JENKINS_AGENT_SSH_PUBKEY}
    secrets:
      - VAULT_ADDR
      - VAULT_CACERT
      - VAULT_ROLE_ID
      - VAULT_SECRET_ID
      - vault.crt
    restart: always
    networks:
      - justicier_justicier_net  # TODO: change into a network not owned by the justicier project
    healthcheck:
      test: bash -c 'exec 3<>/dev/tcp/localhost/22'
      interval: 30s
      timeout: 5s
      retries: 3

  onedrive:
   image: docker.io/driveone/onedrive:edge
   userns_mode: keep-id
   entrypoint: ["/entrypoint-wrapper.sh"]
   volumes:
     - ./services/onedrive/conf:/onedrive/conf
     - ./services/onedrive/data:/onedrive/data
     - ./services/onedrive/logs:/onedrive/logs
     - ./services/onedrive/entrypoint-wrapper.sh:/entrypoint-wrapper.sh:ro
   secrets:
     - DRIVE_ID
   restart: unless-stopped
   networks:
     - justicier_justicier_net
   healthcheck:
     test: sh -c '[ -s /onedrive/conf/items.sqlite3-wal ]'
     interval: 60s
     timeout: 5s
     retries: 2


secrets:
  VAULT_ADDR:
    file: ./secrets/VAULT_ADDR
  VAULT_CACERT:
    file: ./secrets/VAULT_CACERT
  VAULT_ROLE_ID:
    file: ./secrets/VAULT_ROLE_ID
  VAULT_SECRET_ID:
    file: ./secrets/VAULT_SECRET_ID
  vault.crt:
    file: ./secrets/vault.crt
  DRIVE_ID:  # Needs file integration with HashiCorp Vault
    file: ./secrets/DRIVE_ID


networks:
  justicier_justicier_net:  # TODO: change into a network not owned by the justicier project
    external: true

















